<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">⚡ Registro Rápido de Evento Inmutable</h1>
    <p class="subtitle">Tratamientos con retiro, pesajes, vacunas y diagnósticos sanitarios.</p>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div class="glass-card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Seleccionar Animal:</label>
        <select class="form-select" [(ngModel)]="selectedAnimalId">
          <option *ngFor="let a of animals" [value]="a.id">
            {{ a.farmTag || 'Sin arete' }} — {{ a.name || 'Sin nombre' }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Tipo de Evento:</label>
        <select class="form-select" [(ngModel)]="eventType">
          <option value="Treatment">💊 Tratamiento Medicamentoso (con Retiro)</option>
          <option value="Weight">⚖️ Pesaje / Peso Corporal</option>
          <option value="Diagnosis">🩺 Diagnóstico Clínico / Enfermedad</option>
          <option value="Vaccination">💉 Vacunación</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Fecha del Evento:</label>
        <input type="date" class="form-input" [(ngModel)]="eventDate">
      </div>

      <div class="form-group">
        <label class="form-label">Registrado Por:</label>
        <input type="text" class="form-input" [(ngModel)]="recordedBy">
      </div>
    </div>

    <!-- Dynamic Event Fields -->
    <div class="event-details-box mt-3" *ngIf="eventType === 'Treatment'">
      <h4>Detalles del Tratamiento</h4>
      <div class="form-grid mt-2">
        <div class="form-group">
          <label class="form-label">Medicamento Administrado:</label>
          <input type="text" class="form-input" [(ngModel)]="medicationName">
        </div>
        <div class="form-group">
          <label class="form-label">Dosis:</label>
          <input type="text" class="form-input" [(ngModel)]="dosage">
        </div>
        <div class="form-group">
          <label class="form-label">Días de Retiro Sanitario (Bloqueo):</label>
          <input type="number" min="0" class="form-input" [(ngModel)]="withdrawalDays">
          <span class="field-hint">Generará automáticamente el bloqueo de leche/carne.</span>
        </div>
      </div>
    </div>

    <div class="event-details-box mt-3" *ngIf="eventType === 'Weight'">
      <h4>Detalles del Pesaje</h4>
      <div class="form-group mt-2">
        <label class="form-label">Peso Registrado (Kg):</label>
        <input type="number" step="0.5" class="form-input" [(ngModel)]="weightKg">
      </div>
    </div>

    <div class="event-details-box mt-3" *ngIf="eventType === 'Diagnosis'">
      <h4>Detalles del Diagnóstico</h4>
      <div class="form-group mt-2">
        <label class="form-label">Enfermedad / Síntoma:</label>
        <input type="text" class="form-input" [(ngModel)]="diseaseDiagnosis">
      </div>
    </div>

    <div class="form-group mt-3">
      <label class="form-label">Notas Adicionales / Observaciones:</label>
      <textarea class="form-textarea" rows="3" [(ngModel)]="notes"></textarea>
    </div>

    <div class="form-actions mt-4">
      <button class="btn btn-primary btn-lg" (click)="saveEvent()">
        💾 Guardar Evento Inmutable
      </button>
    </div>
  </div>
</div>
