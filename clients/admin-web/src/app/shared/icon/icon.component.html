<svg
  [class]="'icon icon--' + size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  focusable="false"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label() || null"
  [attr.aria-hidden]="label() ? null : 'true'"
>
  @switch (name()) {
    @case ('alert') {
      <path d="M12 3 2.8 20h18.4L12 3Z" />
      <path d="M12 9v4.5" />
      <path d="M12 17h.01" />
    }
    @case ('arrow-left') {
      <path d="m14.5 5-7 7 7 7" />
      <path d="M8 12h11" />
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M8 3v4M16 3v4M3 10h18" />
      <path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" />
    }
    @case ('check') {
      <path d="m5 12 4 4L19 6" />
    }
    @case ('close') {
      <path d="m6 6 12 12M18 6 6 18" />
    }
    @case ('dashboard') {
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
    }
    @case ('dna') {
      <path d="M7 3c0 6 10 6 10 12 0 3-2 5-5 6" />
      <path d="M17 3c0 6-10 6-10 12 0 3 2 5 5 6" />
      <path d="M9 5h6M8 9h8M8 15h8M9 19h6" />
    }
    @case ('file-text') {
      <path d="M6 2h8l4 4v16H6V2Z" />
      <path d="M14 2v5h5M9 12h6M9 16h6" />
    }
    @case ('lock') {
      <rect x="4" y="10" width="16" height="11" rx="2" />
      <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
    }
    @case ('log-out') {
      <path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('milk') {
      <path d="M9 3h6v4l2 3v11H7V10l2-3V3Z" />
      <path d="M9 7h6M7 13h10" />
    }
    @case ('pig') {
      <path d="M7 8 5 5c2.5 0 4 .8 4.8 2.2M17 8l2-3c-2.5 0-4 .8-4.8 2.2" />
      <path d="M5.5 10.5C3.5 11 3 12.5 3 14c0 3.6 3.8 6 9 6s9-2.4 9-6c0-4.2-3.8-7-9-7-2.6 0-4.8.7-6.5 2" />
      <ellipse cx="12" cy="14.5" rx="3.5" ry="2.5" />
      <path d="M10.7 14.5h.01M13.3 14.5h.01M8.5 11.5h.01M15.5 11.5h.01M21 12c1.5-.5 1.7-2.2.4-2.8" />
    }
    @case ('save') {
      <path d="M4 3h13l3 3v15H4V3Z" />
      <path d="M8 3v6h8V3M8 21v-7h8v7" />
    }
    @case ('search') {
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="m15.5 15.5 5 5" />
    }
    @case ('shield') {
      <path d="M12 3 4.5 6v5.5c0 4.7 3 8 7.5 9.5 4.5-1.5 7.5-4.8 7.5-9.5V6L12 3Z" />
      <path d="m9 12 2 2 4-5" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21c.7-4.4 3.4-7 8-7s7.3 2.6 8 7" />
    }
    @case ('wifi') {
      <path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0M9.5 17a4 4 0 0 1 5 0" />
      <path d="M12 21h.01" />
    }
  }
</svg>
