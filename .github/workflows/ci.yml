name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name, commit messages, and PR title
        run: |
          set -e
          FAILED=0
          CONVENTIONAL_REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?(!)?: .+$"
          BRANCH_REGEX="^(feature|release|hotfix|docs)/[a-zA-Z0-9_./-]+$"

          # 1. Validate Branch Name
          BRANCH_NAME="${{ github.head_ref }}"
          if [ -n "$BRANCH_NAME" ]; then
            if ! echo "$BRANCH_NAME" | grep -Eq "$BRANCH_REGEX"; then
              echo "::error::Nombre de rama inválido: '$BRANCH_NAME'. Debe comenzar con feature/, release/, hotfix/ o docs/ (AGENTS.md regla 4, Art. 13)."
              FAILED=1
            else
              echo "OK: Rama '$BRANCH_NAME' cumple la convención."
            fi
          fi

          # 2. Validate PR Title
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [ -n "$PR_TITLE" ]; then
            if ! echo "$PR_TITLE" | grep -Eq "$CONVENTIONAL_REGEX"; then
              echo "::error::Título del PR inválido: '$PR_TITLE'. Debe cumplir Conventional Commits (ej. 'feat(modulo): descripcion' o 'chore: descripcion')."
              FAILED=1
            else
              echo "OK: Título del PR '$PR_TITLE' cumple Conventional Commits."
            fi
          fi

          # 3. Validate Commits in PR
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ]; then
            echo "Validando commits contra origin/$BASE_REF..."
            COMMITS=$(git log "origin/$BASE_REF..HEAD" --format="%s" || true)
            while IFS= read -r msg; do
              [ -z "$msg" ] && continue
              if echo "$msg" | grep -Eq "^Merge "; then
                continue
              fi
              if ! echo "$msg" | grep -Eq "$CONVENTIONAL_REGEX"; then
                echo "::error::Mensaje de commit inválido: '$msg'. Debe cumplir Conventional Commits (ej. 'feat(modulo): descripcion')."
                FAILED=1
              else
                echo "OK: Commit '$msg' cumple Conventional Commits."
              fi
            done <<< "$COMMITS"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Fallo en la verificación de higiene de PR."
            exit 1
          fi
          echo "Higiene de PR verificada con éxito."

  backend-build-and-test:
    runs-on: ubuntu-latest

    # One PostgreSQL for the whole job instead of one container per test fixture.
    # TestSupport's TestDatabase creates a fresh database per fixture on this server,
    # so isolation is unchanged while the suite stops paying for ~10 container starts
    # (and stops depending on the runner's Docker being able to build bridge networks,
    # which is the failure that keeps developer machines out of the integration suite).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # No password, by design: the container lives for the length of this job and
          # is reachable only from it. Inventing a credential here would put one in the
          # repository, which is precisely what this project does not do (README,
          # "Puesta en marcha") — and a hardcoded one is what GitGuardian would flag.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Remove this variable and the suite falls back to Testcontainers, unchanged.
      HATO_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify Format
        run: dotnet format --verify-no-changes

      - name: Build
        run: |
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dotnet build --no-restore --configuration Release \
            -p:Version="$VERSION" \
            -p:SourceRevisionId="$COMMIT" \
            -p:InformationalVersion="$VERSION+$COMMIT.$BUILD_DATE"

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  field-app-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/field-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: clients/field-app/package.json

      - name: Stamp version
        run: |
          VERSION=$(cat ../../VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            pkg.buildMetadata = { commit: '$COMMIT', buildDate: '$BUILD_DATE' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const appPath = 'app.json';
            if (fs.existsSync(appPath)) {
              const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
              if (app.expo) {
                app.expo.version = '$VERSION';
                app.expo.extra = { ...(app.expo.extra || {}), commit: '$COMMIT', buildDate: '$BUILD_DATE' };
                fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');
              }
            }
          "

      # --legacy-peer-deps is required because @nozbe/with-observables@1.6.0 still
      # declares peer @types/react ^16||^17||^18 — the project is on React 19 since the
      # SDK 51 -> 56 upgrade. The runtime types are structurally compatible (TS forwards
      # them correctly); the warning is informational, not blocking. Documented in the
      # PR body so reviewers know it's intentional.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

  admin-web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/admin-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: clients/admin-web/package-lock.json

      - name: Stamp version
        run: |
          VERSION=$(cat ../../VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            pkg.buildMetadata = { commit: '$COMMIT', buildDate: '$BUILD_DATE' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (compile + typecheck + budget check)
        run: npx ng build --configuration production

      - name: Run unit tests
        run: npx ng test --watch=false

  # Red de seguridad de privacidad, no de calidad: docs/tesis/privado/ contiene la
  # tesis con nombres de personas, cartas firmadas y datos de finca de un cliente
  # real, y este repositorio es MIT. .gitignore ya lo excluye; este job existe para
  # el caso en que un `git add -f` o un `git add -A` distraído lo evada. GitGuardian
  # atrapa credenciales, no datos personales.
  tesis-privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No thesis private files may be tracked
        run: |
          tracked="$(git ls-files 'docs/tesis/privado' 'docs/tesis/privado/**')"
          if [ -n "$tracked" ]; then
            echo "::error::Hay archivos privados de la tesis rastreados por git:"
            echo "$tracked"
            echo "Sácalos con 'git rm --cached <archivo>' antes de abrir el PR."
            exit 1
          fi
          echo "OK: docs/tesis/privado/ no está rastreado."
