# Fragmento de configuración sshd para el usuario de despliegue `hato-deploy`.
#
# Instalar como /etc/ssh/sshd_config.d/50-hato-deploy.conf (root:root, 644).
# Validar siempre con `sudo sshd -t` antes de recargar sshd — ver
# ops/production/bootstrap.md sección 4.
#
# Aplica solo a la cuenta hato-deploy; no afecta a ninguna otra cuenta del sistema.
Match User hato-deploy

    # Lee la clave autorizada desde una ruta root-owned dedicada, no desde
    # ~/.ssh/authorized_keys de la propia cuenta (que hato-deploy podría
    # llegar a controlar si su home no está bien protegido).
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u

    # El comando forzado en authorized_keys (deploy-entry) es la única acción
    # permitida. Estas directivas cierran las vías alternativas que "restrict"
    # en authorized_keys ya deshabilita por defecto; se declaran aquí también
    # como segunda capa explícita e independiente de esa entrada.
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    AllowAgentForwarding no
    PermitTunnel no

    # Sin sesiones interactivas: el único uso legítimo de esta cuenta es
    # ejecutar el comando forzado no interactivo.
    ForceCommand /usr/local/libexec/hato/deploy-entry

Match all
