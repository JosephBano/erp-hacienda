services:
  postgres:
    image: postgres:16-alpine
    container_name: hato-postgres
    environment:
      POSTGRES_DB: hato
      POSTGRES_USER: hato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (ver .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - hato-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hato -d hato"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hato-pgdata:
