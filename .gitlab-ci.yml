# Pipeline de HATO en el GitLab institucional.
#
# Las reglas comunes se mantienen en istpet/plantillas para que sus
# correcciones lleguen a todos los proyectos desde una única fuente.
include:
  - project: istpet/plantillas
    ref: main
    file:
      - /ci/gitflow.yml
      - /ci/gitleaks.yml

# 'validar' viene de gitflow.yml y va primero. El include ya declara las
# etapas, pero repetirlas aquí deja el orden a la vista: si algún día el
# include cambiara, los jobs de este archivo seguirían apuntando a etapas
# que existen en lugar de romper la creación del pipeline.
stages:
  - validar
  - build
  - test
  - deploy

# El runner institucional no acepta jobs sin etiqueta. Este valor también se
# aplica a los jobs heredados mediante los includes anteriores.
default:
  tags:
    - k3s
  # El rechazo por cuota es transitorio: el pod del job anterior sigue contando
  # durante unos segundos después de terminar, y el siguiente job se lanza tres
  # segundos más tarde. Reintentar le da al namespace el tiempo que le faltaba.
  #
  # Solo se reintentan los fallos de infraestructura. Un test que falla o un
  # `dotnet format` que encuentra diferencias siguen fallando a la primera:
  # reintentar un fallo real solo esconde el problema y triplica la espera.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - unknown_failure

variables:
  # El namespace 'gitlab-runner' tiene una ResourceQuota de 3 CPU / 3 Gi, y el
  # pod que arma el runner por defecto pide 1500m/1536Mi — sin importar que el
  # script sea un `grep` sobre alpine. Con el runner manager ocupando ~500m,
  # un solo job de esos deja la cuota sin margen y el siguiente muere con
  # 'exceeded quota: ... is forbidden' antes de ejecutar una sola línea.
  # Es exactamente lo que pasó en los pipelines #41 y #42.
  #
  # OJO: el runner solo respeta estas variables si su configuración define los
  # correspondientes '*_overwrite_max_allowed'. Si no los tiene, GitLab las
  # ignora en silencio y no hay arreglo posible desde este archivo: hay que
  # pedir al administrador que suba la cuota o habilite el overwrite.
  KUBERNETES_CPU_REQUEST: "100m"
  KUBERNETES_CPU_LIMIT: "500m"
  KUBERNETES_MEMORY_REQUEST: "256Mi"
  KUBERNETES_MEMORY_LIMIT: "512Mi"
  KUBERNETES_HELPER_CPU_REQUEST: "50m"
  KUBERNETES_HELPER_CPU_LIMIT: "200m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "64Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"

# Los jobs que compilan .NET o Angular no caben en el tamaño de arriba. Se les
# da lo mínimo con lo que terminan y se serializan entre sí: dentro de una
# cuota de 3 CPU no pueden coincidir dos, y el pod del job anterior tarda unos
# segundos en desaparecer del namespace (el runner registra
# 'Error cleaning up pod'), así que sigue contando mientras el siguiente pide
# su sitio.
.pesado:
  resource_group: hato-ci
  variables:
    KUBERNETES_CPU_REQUEST: "500m"
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "1536Mi"

# Las validaciones de Git Flow son scripts de shell sobre alpine: les basta el
# tamaño por defecto de arriba. Se serializan igual porque son seis y la cuota
# no tolera que se solapen con la limpieza de pods pendiente.
gitflow:rama:
  resource_group: hato-ci

gitflow:issue:
  resource_group: hato-ci
  needs:
    - job: gitflow:rama
      artifacts: false
      optional: true

gitflow:metadatos:
  resource_group: hato-ci
  needs:
    - job: gitflow:issue
      artifacts: false
      optional: true

gitflow:commits:
  resource_group: hato-ci
  needs:
    - job: gitflow:metadatos
      artifacts: false
      optional: true

gitflow:plantilla:
  resource_group: hato-ci
  needs:
    - job: gitflow:commits
      artifacts: false
      optional: true

gitflow:secretos:
  resource_group: hato-ci
  needs:
    - job: gitflow:plantilla
      artifacts: false
      optional: true

# Construye las dos imágenes desplegables para comprobar sus Dockerfiles.
#
# Con Kaniko y no con docker:dind: dind necesita un contenedor privilegiado y
# el runner de k3s no lo concede, así que el job moría en `docker info`. Kaniko
# construye en espacio de usuario y es lo que usa la plantilla oficial de
# istpet/plantillas.
#
# `--no-push` mantiene el contrato que ya tenía este job: solo valida que el
# Dockerfile construya. Publicar en Harbor exige decidir credenciales, nombres
# y versionado, y eso es una conversación aparte.
#
# Son dos jobs y no dos invocaciones seguidas en uno solo porque Kaniko extrae
# las capas de la imagen base sobre su propio sistema de archivos: encadenar
# dos builds en el mismo contenedor deja restos del primero en el segundo.
.kaniko:
  extends: .pesado
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  # No se construye imagen en cada merge request. La plantilla oficial lo evita
  # por la memoria del nodo, y aquí además cada build extra compite por la
  # misma cuota que necesitan los tests.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:image:api:
  extends: .kaniko
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/src/Hato.Api/Dockerfile"
      --no-push

build:image:admin-web:
  extends: .kaniko
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/clients/admin-web"
      --dockerfile "$CI_PROJECT_DIR/clients/admin-web/Dockerfile"
      --no-push

# Compila y prueba toda la solución contra un PostgreSQL real. Cada fixture
# crea su propia base en este servidor mediante Hato.TestSupport.TestDatabase.
test:backend:
  extends: .pesado
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_DB: postgres
    HATO_TEST_POSTGRES: "Host=postgres;Port=5432;Database=postgres;Username=postgres"
    # El contenedor de servicio tiene su propia reserva, aparte de la del job.
    # Postgres arranca de sobra con esto y así no se come la cuota que necesita
    # la compilación.
    KUBERNETES_SERVICE_CPU_REQUEST: "100m"
    KUBERNETES_SERVICE_CPU_LIMIT: "500m"
    KUBERNETES_SERVICE_MEMORY_REQUEST: "128Mi"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "512Mi"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - dotnet restore
    - dotnet format --verify-no-changes
    - dotnet build --no-restore --configuration Release
    - dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - TestResults/

# Verifica que la aplicación de campo compile a nivel de tipos y que sus
# pruebas unitarias pasen. La opción legacy mantiene el contrato del CI actual.
test:field-app:
  extends: .pesado
  stage: test
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd clients/field-app
    - npm ci --legacy-peer-deps
    - npm run typecheck
    - npm test

# La compilación de producción de Angular incluye compilación, comprobación de
# tipos y presupuestos; después se ejecutan sus pruebas unitarias sin watch.
#
# `ng build --configuration production` descarga las fuentes de
# fonts.googleapis.com para incrustarlas, así que este job depende de que el
# runner tenga salida a internet. Si el cortafuegos institucional la corta,
# falla siempre con 'Failed to inline external stylesheet' y la solución es
# auto-hospedar las fuentes en clients/admin-web/src, no tocar este archivo.
test:admin-web:
  extends: .pesado
  stage: test
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd clients/admin-web
    - npm ci
    - npx ng build --configuration production
    - npx ng test --watch=false
