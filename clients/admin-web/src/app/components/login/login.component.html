<div class="login-page">
  <form class="login-card" (ngSubmit)="submit()" novalidate>
    <div class="login-brand">
      <app-icon name="pig" size="xl" label="Logo de HATO ERP"></app-icon>
      <h1>HATO ERP</h1>
      <p>Gestión porcina y ganadera</p>
    </div>

    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" inputmode="email" />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" />

    <p class="error-message" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="isSubmitting" [attr.aria-busy]="isSubmitting">
      <app-icon *ngIf="!isSubmitting" name="user" size="md"></app-icon>
      <span>{{ isSubmitting ? 'Ingresando…' : 'Ingresar' }}</span>
    </button>
  </form>
</div>
