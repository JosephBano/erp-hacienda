# Pipeline de HATO en el GitLab institucional.
#
# Las reglas comunes se mantienen en istpet/plantillas para que sus
# correcciones lleguen a todos los proyectos desde una única fuente.
include:
  - project: istpet/plantillas
    ref: main
    file:
      - /ci/gitflow.yml
      - /ci/gitleaks.yml

# 'validar' viene de gitflow.yml y va primero. El include ya declara las
# etapas, pero repetirlas aquí deja el orden a la vista: si algún día el
# include cambiara, los jobs de este archivo seguirían apuntando a etapas
# que existen en lugar de romper la creación del pipeline.
#
# 'test' va ANTES que 'build', al revés que en el include. Desde que las
# imágenes se publican en Harbor el orden dejó de ser indiferente: construir
# primero significaba subir ':latest' y solo después descubrir que los tests
# fallaban. Ahora una imagen solo llega al registro si todo lo anterior pasó.
stages:
  - validar
  - test
  - build
  - deploy

# Runner propio (id 9, 'PC de Joseph'), de tipo proyecto y bloqueado a este
# repositorio. Se dejó de usar la etiqueta 'k3s' porque la comparten los dos
# runners de instancia y no permitía elegir cuál tomaba cada job; uno de ellos
# es Windows con ejecutor shell y habría reventado con nuestras imágenes Linux.
default:
  tags:
    - hato-local
  # Solo se reintentan los fallos de infraestructura (una imagen que no se pudo
  # descargar, el daemon de Docker ocupado). Un test que falla o un
  # `dotnet format` que encuentra diferencias siguen fallando a la primera:
  # reintentar un fallo real solo esconde el problema y triplica la espera.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - unknown_failure

# Los seis jobs gitflow:* vienen completos del include y ya no se redeclaran
# aquí: solo existían para imponerles 'resource_group', que era un parche
# contra la cuota del runner de k3s. El runner local admite cuatro a la vez.

# Comprueba, antes de gastar minutos construyendo, que la vía a Harbor está
# abierta: que la integración entrega sus variables, que el certificado fijado
# valida el TLS y que el robot tiene permiso de escritura sobre el proyecto.
#
# Es deliberadamente barato (alpine + curl, sin construir imagen) para poder
# correrlo en cada merge request: si alguien desactiva la integración o rota la
# credencial del robot, se ve aquí y no al mergear a main.
harbor:credenciales:
  stage: validar
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - apk add --no-cache curl >/dev/null
    - |
      for v in HARBOR_HOST HARBOR_PROJECT HARBOR_USERNAME HARBOR_PASSWORD; do
        eval "val=\$$v"
        if [ -z "$val" ]; then echo "$v: AUSENTE"; falta=1; else echo "$v: definida"; fi
      done
      [ -z "$falta" ] || { echo "Revisa Settings > Integrations > Harbor."; exit 1; }
    # El /v2/ del registro responde 200 solo si el token del robot sirve. Se
    # valida el TLS contra el certificado fijado: si eso falla, kaniko fallaría
    # igual al publicar, y es mejor enterarse aquí.
    - |
      codigo=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$HARBOR_CA" \
        -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "https://$HARBOR_HOST/v2/")
      echo "GET /v2/ -> $codigo"
      [ "$codigo" = "200" ] || { echo "El robot no autentica contra Harbor."; exit 1; }
    # Un push necesita 'push' sobre el proyecto, no solo poder entrar. El scope
    # de escritura se comprueba pidiendo un upload y cancelandolo acto seguido.
    - |
      subida=$(curl -s -o /dev/null -w '%{http_code}' -X POST --cacert "$HARBOR_CA" \
        -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" \
        "https://$HARBOR_HOST/v2/$HARBOR_PROJECT/hato-api/blobs/uploads/")
      echo "POST blobs/uploads/ -> $subida"
      case "$subida" in
        202) echo "El robot puede publicar en $HARBOR_PROJECT." ;;
        *)   echo "Sin permiso de push (esperado 202)."; exit 1 ;;
      esac

# Publicación de las dos imágenes desplegables en Harbor.
#
# El patrón (config.json de kaniko armado a mano, doble --destination sha +
# móvil) es el de jorge.doicela/plantilla-dotnet-clean, para no inventar una
# convención propia. Con una corrección: aquella usa $HARBOR_USER, que no
# existe. La integración Harbor de GitLab publica $HARBOR_USERNAME, $HARBOR_HOST,
# $HARBOR_PROJECT y $HARBOR_PASSWORD, y de ahí salen las credenciales sin que
# haya que guardar ninguna a mano. (Aquel job lleva allow_failure: true, así
# que su push fallido no se nota.)
#
# Con Kaniko y no con docker:dind: dind necesita un contenedor privilegiado, y
# el runner local corre sin privilegios a propósito. Kaniko construye en
# espacio de usuario y es lo que usa la plantilla oficial de istpet/plantillas.
#
# Son dos jobs y no dos invocaciones seguidas en uno solo porque Kaniko extrae
# las capas de la imagen base sobre su propio sistema de archivos: encadenar
# dos builds en el mismo contenedor deja restos del primero en el segundo.
.kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    # Sin credenciales el build entero es tiempo perdido: kaniko construiría las
    # capas y solo fallaría al empujarlas. Mejor cortar aquí y decir qué falta.
    - |
      if [ -z "$HARBOR_USERNAME" ] || [ -z "$HARBOR_PASSWORD" ] || [ -z "$HARBOR_HOST" ]; then
        echo "La integracion Harbor no esta entregando sus variables."
        echo "Revisa Settings > Integrations > Harbor (debe estar Active)."
        echo "  HARBOR_HOST     : ${HARBOR_HOST:-AUSENTE}"
        echo "  HARBOR_PROJECT  : ${HARBOR_PROJECT:-AUSENTE}"
        echo "  HARBOR_USERNAME : ${HARBOR_USERNAME:+definida}${HARBOR_USERNAME:-AUSENTE}"
        echo "  HARBOR_PASSWORD : ${HARBOR_PASSWORD:+definida}${HARBOR_PASSWORD:-AUSENTE}"
        exit 1
      fi
    - mkdir -p /kaniko/.docker /kaniko/ssl/certs
    # El certificado de Harbor lo firma 'ISTPET Internal CA', que no está en el
    # almacén de la imagen. Se ancla el propio certificado del servidor, que
    # viaja en la variable de archivo HARBOR_CA. Kaniko es Go, y Go acepta como
    # raíz una hoja presente en el pool: comprobado contra harbor antes de
    # escribir esto. La plantilla de istpet resuelve lo mismo con
    # --skip-tls-verify; esto valida a quién le entregamos la imagen.
    - cp "$HARBOR_CA" /kaniko/ssl/certs/additional-ca-cert-bundle.crt
    # printf y no echo: el JSON lleva comillas y una contraseña que no debe
    # pasar por expansiones extra.
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
        "$HARBOR_HOST" "$HARBOR_USERNAME" "$HARBOR_PASSWORD" > /kaniko/.docker/config.json
    # Etiqueta móvil según el origen del pipeline. Fuera de la rama por defecto
    # nunca es 'latest': una imagen salida de un merge request no puede quedarse
    # con el nombre que otros despliegan.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        ETIQUETA_MOVIL="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        ETIQUETA_MOVIL="latest"
      else
        ETIQUETA_MOVIL="mr-$CI_MERGE_REQUEST_IID"
      fi
      export ETIQUETA_MOVIL
  # Dos builds de imagen a la vez no caben: 'ng build' y 'dotnet publish' piden
  # mucha memoria y el runner vive en una máquina de trabajo con otras cosas
  # encima. Al lanzarlos en paralelo, el de admin-web murió con
  # 'signal: terminated' a mitad de 'ng build'. Se turnan.
  resource_group: imagenes
  # Se publica desde merge request, rama por defecto y tags. Las tres producen
  # imágenes con nombres distintos, así que no se pisan entre sí.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Cada imagen sale con dos etiquetas: el sha corto, que identifica sin ambigüedad
# el commit que la produjo, y la etiqueta móvil calculada arriba.
#
# El nombre se arma en el shell y no en 'variables:' para no depender de que
# GitLab sepa expandir variables que vienen de la integración Harbor dentro de
# otra variable del YAML.
build:image:api:
  extends: .kaniko
  variables:
    NOMBRE_IMAGEN: hato-api
  script:
    - |
      IMAGEN="$HARBOR_HOST/$HARBOR_PROJECT/$NOMBRE_IMAGEN"
      echo "Publicando $IMAGEN con las etiquetas $CI_COMMIT_SHORT_SHA y $ETIQUETA_MOVIL"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/src/Hato.Api/Dockerfile" \
        --destination "$IMAGEN:$CI_COMMIT_SHORT_SHA" \
        --destination "$IMAGEN:$ETIQUETA_MOVIL"

build:image:admin-web:
  extends: .kaniko
  variables:
    NOMBRE_IMAGEN: hato-admin-web
  script:
    - |
      IMAGEN="$HARBOR_HOST/$HARBOR_PROJECT/$NOMBRE_IMAGEN"
      echo "Publicando $IMAGEN con las etiquetas $CI_COMMIT_SHORT_SHA y $ETIQUETA_MOVIL"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/clients/admin-web" \
        --dockerfile "$CI_PROJECT_DIR/clients/admin-web/Dockerfile" \
        --destination "$IMAGEN:$CI_COMMIT_SHORT_SHA" \
        --destination "$IMAGEN:$ETIQUETA_MOVIL"

# Compila y prueba toda la solución contra un PostgreSQL real. Cada fixture
# crea su propia base en este servidor mediante Hato.TestSupport.TestDatabase.
test:backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_DB: postgres
    HATO_TEST_POSTGRES: "Host=postgres;Port=5432;Database=postgres;Username=postgres"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - dotnet restore
    - dotnet format --verify-no-changes
    - dotnet build --no-restore --configuration Release
    - dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - TestResults/

# Verifica que la aplicación de campo compile a nivel de tipos y que sus
# pruebas unitarias pasen. La opción legacy mantiene el contrato del CI actual.
test:field-app:
  stage: test
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd clients/field-app
    - npm ci --legacy-peer-deps
    - npm run typecheck
    - npm test

# La compilación de producción de Angular incluye compilación, comprobación de
# tipos y presupuestos; después se ejecutan sus pruebas unitarias sin watch.
#
# `ng build --configuration production` descarga las fuentes de
# fonts.googleapis.com para incrustarlas, así que este job depende de que el
# runner tenga salida a internet. Si el cortafuegos institucional la corta,
# falla siempre con 'Failed to inline external stylesheet' y la solución es
# auto-hospedar las fuentes en clients/admin-web/src, no tocar este archivo.
test:admin-web:
  stage: test
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd clients/admin-web
    - npm ci
    - npx ng build --configuration production
    - npx ng test --watch=false
